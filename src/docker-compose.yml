services:
  maze-solver:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ros
        USER_UID: 1000
        USER_GID: 1000
    image: ros2-humble-maze-solver:latest
    container_name: ros2_maze_solver
    stdin_open: true
    tty: true
    network_mode: host
    ipc: host
    privileged: true
    user: "1000:1000"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
    volumes:
      # X11 Display Socket for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Workspace sync
      - .:/workspace/src:rw
      # GPU / DRI device acceleration
      - /dev/dri:/dev/dri:rw
    working_dir: /workspace/src
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, video, display, utility, compute]
